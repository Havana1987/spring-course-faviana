# AMBIENTE
app.environment=test

# JPA
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none

# LOG
logging.level.root=INFO
logging.level.com.example.spring_course=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=TRACE

#FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

#LIQUIBASE
spring.liquibase.enabled=false

#MONGO
spring.mongodb.uri=${SPRING_DATASOURCE_URL_MONGO:mongodb://root:root@localhost:27017/spring_course_faviana?authSource=admin}

app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=spring-course

# Cache demo: provider in-memory di Spring
spring.cache.type=simple

# Caching / Scheduling / Async
app.scheduler.product-stats.fixed-rate=${APP_SCHEDULER_PRODUCT_STATS_FIXED_RATE:60000}
app.scheduler.product-stats.initial-delay=${APP_SCHEDULER_PRODUCT_STATS_INITIAL_DELAY:10000}